name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run build
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/

  analyze:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: ANALYZE=true bun run build
      - name: Comment bundle size on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            try {
              const stats = JSON.parse(fs.readFileSync('.next/analyze/bundle-stats.json', 'utf8'))
              const total = (stats.totalSize / 1024).toFixed(1)
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## Bundle Analysis\n\nTotal size: **${total} KB**\n\n| Page | Size |\n|------|------|\n${stats.pages.map(p => `| ${p.name} | ${(p.size / 1024).toFixed(1)} KB |`).join('\n')}`
              })
            } catch (e) {
              console.log('No bundle stats found, skipping comment')
            }